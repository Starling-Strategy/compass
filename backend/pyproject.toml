[project]
name = "nctqai-platform"
version = "0.2.0"
description = "NCTQ.ai Platform — Compass and Dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "NCTQ", email = "dev@nctq.org"}
]

dependencies = [
    # Compass backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pydantic-ai>=1.99,<2",
    "asyncpg>=0.29.0",
    "sse-starlette>=2.1.0",
    # Plain httpx (NO [socks] extra). Production reaches PostgreSQL
    # directly via the Container App's NAT Gateway — proxychains and
    # the SOCKS5/Tailscale path were removed on 2026-04-20 and must
    # never come back to nctq-azure-push. See ai_instructions/MEMORY.md.
    "httpx>=0.28.0",
    # Authentication
    "fastapi-azure-auth>=5.2.0",
    # Observability
    "logfire[fastapi,asyncpg,httpx,pydantic-ai,starlette]>=4.0.0",
    # Publications content extraction
    "trafilatura>=1.12.0",
    "cachetools>=5.3.0",
    # LLM cost calculation
    "genai-prices>=0.0.50",
    # Dashboard (nctqai)
    "python-fasthtml>=0.12.48",
    "monsterui>=0.1",
    "psycopg2-binary>=2.9.0",
    # Conversation export PDF
    "reportlab>=4.0,<5",
    "markdown-it-py>=3,<5",
    # NCTQ policy guidance markdown parsing (frontmatter)
    "pyyaml>=6.0,<7",
    # Offline eval CLI
    "typer>=0.9.0",
    # Fuzzy district-name matching for the selection_set_matches_request L2 validator
    # (tolerates "HISD" vs "Houston Independent School District" variance).
    "rapidfuzz>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_backend", "src/nctqai", "scripts"]
artifacts = ["src/compass_backend/instructions/**/*.md"]

[tool.logfire]
ignore_no_config = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "docs/plans",             # Historical planning artifacts
    "docs/superpowers",       # Historical planning artifacts
]

[tool.ruff.lint]
# Full pyflakes (F): undefined names (F821), redefinitions (F811),
# use-before-define (F823), unused imports (F401), unused variables (F841),
# and empty f-strings (F541). The F401/F541/F841 cleanup that earlier Tier 1
# infrastructure PRs deferred is now applied (see #1181), so these rules stay
# enforced to stop dead code re-accumulating. Broader stylistic families
# (E pycodestyle, I import-sort, UP pyupgrade, B bugbear) remain opt-in
# follow-ups to avoid large reformatting diffs.
select = ["F"]

[tool.pyright]
include = ["src/compass_backend", "src/compass_data_sync", "src/nctqai"]
pythonVersion = "3.12"
# Start permissive — the codebase has not been type-checked before. Tighten
# in a follow-up PR once the existing type debt is paid down.
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/compass_backend/tests", "src/compass_data_sync/tests", "scripts/pa_eval/tests", "scripts/data_fidelity/tests"]
# Default-exclude llm + slow markers so local invocations match CI
# (.github/workflows/code-health.yml). Opt back in with `pytest -m llm`
# (which overrides this addopts) when running the live planner tests manually.
addopts = ["-m", "not slow and not llm"]
markers = [
    "slow: marks tests that hit external services (deselect with '-m \"not slow\"')",
    "llm: marks tests that make real LLM calls (requires PYDANTIC_AI_GATEWAY_API_KEY in .env)",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pydantic-evals>=0.1.0",
    # >=6.10.2 clears the pypdf DoS/RAM-exhaustion advisories (all patched on 6.x);
    # only usage is `from pypdf import PdfReader` in scripts/validate_export_scenarios.py.
    "pypdf>=6.10.2,<7",
]

[project.scripts]
compass = "compass_backend.main:main"
pa-eval = "scripts.pa_eval.cli:main"
data-fidelity = "scripts.data_fidelity.cli:main"
